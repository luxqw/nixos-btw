# Locking is hyprlock's (U2F), started here and not by Caelestia: the shell
# locks on logind's Lock signal, so nothing in this session calls
# `loginctl lock-session`. Started by the hypridle user unit (home.nix).
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = pidof hyprlock || hyprlock
}

listener {
    timeout = 300
    on-timeout = pidof hyprlock || hyprlock
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
