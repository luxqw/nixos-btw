# Umbriel session config.
# Edits hot-reload; check with `umbriel config validate`.
# Docs: https://docs.noctalia.dev/umbriel/

# Colors come from noctalia's umbriel template (noctalia.toml); its apply.sh
# looks for exactly this include and leaves the file alone when present.
[include.optional]
files = ["noctalia.toml"]

[general]
autostart = ["noctalia"]
show_cheatsheet = false

# ─────────────────────────────── outputs ───────────────────────────────

[output.eDP-1]
mode = "2560x1600@165"
scale = 1.5
transform = "normal"
position = [3440, 0]

[output.DP-2]
mode = "3440x1440@165"
scale = 1.0
# "always" flickers on this VA panel on the desktop; games and video only.
vrr = "fullscreen"
transform = "normal"
position = [0, 0]

[output.HDMI-A-1]
enabled = false

# ──────────────────────────────── input ────────────────────────────────

[input.keyboard]
layout = "us,ru"
options = "grp:win_space_toggle"
repeat_delay = 200
repeat_rate = 35
numlock_toggle = true

# Same theme as home.pointerCursor in home.nix.
[input.cursor]
theme = "Bibata-Modern-Classic"
size = 24

[input.touchpad]
tap = true
natural_scroll = true

[input.focus]
follows_mouse = true
follows_mouse_max_scroll = 0.0

# ─────────────────────────────── layout ────────────────────────────────

[layout]
gap = 5
extent_presets = [0.33333, 0.5, 0.66667]

[layout.scrolling]
default_extent_fraction = 0.5
center_focused = "never"

[appearance]
prefer_no_csd = true
border_width = 2
corner_radius = 4

# Two wider passes look like the default three and cost a third less GPU per
# blurred frame.
[appearance.blur]
passes = 2
radius = 7

# Pinned to the ultrawide by position, not by name: noctalia's bar labels a
# named workspace with its name, which then travels with workspace-move-*.
[[workspace]]
index = 1
output = "DP-2"

[[workspace]]
index = 2
output = "DP-2"

[[workspace]]
index = 3
output = "DP-2"

# Blur behind noctalia surfaces and a hot corner for overview.
# blur_optimized blurs the wallpaper once instead of everything below each
# layer every frame; unoptimized, workspace animations cost ~75% more
# compositor CPU and stutter on this nvidia setup.
[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.5
blur_popups = true
blur_optimized = true

[[window_rule]]
match.app_id = "^keyhints$"
default_floating = true
default_floating_size = { width = 0.6, height = 0.7 }

[hot_corners.top_left]
enabled = true
delay_ms = 500
action = "overview-open"

# ────────────────────────────── animation ──────────────────────────────

[animation]
enabled = true
duration_ms = 250
curve = "easeout"

[animation.windows_in]
enabled = true
curve = "spring:1,900"
style = "popin"
scale = 0.5

[animation.windows_out]
enabled = true
curve = "spring:1,1400"
style = "popin"
scale = 0.8

[animation.windows_move]
enabled = true
curve = "spring:1,900"

[animation.workspaces]
enabled = true
curve = "spring:1,800"

[animation.overview]
enabled = true
curve = "spring:1,800"
workspace_curve = "spring:1,1000"

[animation.border]
enabled = true
curve = "spring:1,900"

[animation.dim_unfocused]
enabled = false

[animation.layers]
enabled = false

# ─────────────────────────────── keybinds ──────────────────────────────
# Defining this table replaces Umbriel's built-in binds.

[keybinds]
"Mod+Shift+Slash" = "cheatsheet-toggle"
"Mod+F1" = { action = "spawn:foot --app-id=keyhints keyhints", repeat = false }
"Mod+D" = { action = "spawn:noctalia msg panel-toggle launcher", repeat = false }
"Mod+T" = { action = "spawn:noctalia msg panel-toggle clipboard", repeat = false }
"Mod+Return" = { action = "spawn:foot", repeat = false }

"XF86AudioRaiseVolume" = { action = "spawn:wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1+", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn:wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1-", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn:wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle", allow_when_locked = true }
"XF86AudioMicMute" = { action = "spawn:wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle", allow_when_locked = true }
"XF86MonBrightnessUp" = { action = "spawn:brightnessctl --class=backlight set +10%", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn:brightnessctl --class=backlight set 10%-", allow_when_locked = true }

"Mod+O" = { action = "overview-toggle", repeat = false }
"Mod+Q" = { action = "window-close", repeat = false }

# Focus
"Mod+Left" = "window-focus-left"
"Mod+Down" = "window-focus-down"
"Mod+Up" = "window-focus-up"
"Mod+Right" = "window-focus-right"
"Mod+H" = "window-focus-left"
"Mod+J" = "window-focus-down"
"Mod+K" = "window-focus-up"
"Mod+L" = "window-focus-right"

# Move
"Mod+Ctrl+Left" = "column-move-left"
"Mod+Ctrl+Down" = "window-move-down"
"Mod+Ctrl+Up" = "window-move-up"
"Mod+Ctrl+Right" = "column-move-right"
"Mod+Ctrl+H" = "column-move-left"
"Mod+Ctrl+J" = "window-move-down"
"Mod+Ctrl+K" = "window-move-up"
"Mod+Ctrl+L" = "column-move-right"

"Mod+Home" = "column-focus-first"
"Mod+End" = "column-focus-last"
"Mod+Ctrl+Home" = "column-move-to-first"
"Mod+Ctrl+End" = "column-move-to-last"

# Monitors
"Mod+Shift+Left" = "output-focus-left"
"Mod+Shift+Down" = "output-focus-down"
"Mod+Shift+Up" = "output-focus-up"
"Mod+Shift+Right" = "output-focus-right"
"Mod+Shift+H" = "output-focus-left"
"Mod+Shift+J" = "output-focus-down"
"Mod+Shift+K" = "output-focus-up"
"Mod+Shift+L" = "output-focus-right"

"Mod+Shift+Ctrl+Left" = "column-move-to-output-left"
"Mod+Shift+Ctrl+Down" = "column-move-to-output-down"
"Mod+Shift+Ctrl+Up" = "column-move-to-output-up"
"Mod+Shift+Ctrl+Right" = "column-move-to-output-right"
"Mod+Shift+Ctrl+H" = "column-move-to-output-left"
"Mod+Shift+Ctrl+J" = "column-move-to-output-down"
"Mod+Shift+Ctrl+K" = "column-move-to-output-up"
"Mod+Shift+Ctrl+L" = "column-move-to-output-right"

# Workspaces
"Mod+Page_Down" = "workspace-next"
"Mod+Page_Up" = "workspace-previous"
"Mod+U" = "workspace-next"
"Mod+I" = "workspace-previous"
"Mod+Ctrl+Page_Down" = "column-move-to-workspace-next"
"Mod+Ctrl+Page_Up" = "column-move-to-workspace-previous"
"Mod+Ctrl+U" = "column-move-to-workspace-next"
"Mod+Ctrl+I" = "column-move-to-workspace-previous"
"Mod+Shift+Page_Down" = "workspace-move-down"
"Mod+Shift+Page_Up" = "workspace-move-up"
"Mod+Shift+U" = "workspace-move-down"
"Mod+Shift+I" = "workspace-move-up"

"Mod+WheelDown" = { action = "workspace-next", cooldown_ms = 150 }
"Mod+WheelUp" = { action = "workspace-previous", cooldown_ms = 150 }
"Mod+Ctrl+WheelDown" = { action = "column-move-to-workspace-next", cooldown_ms = 150 }
"Mod+Ctrl+WheelUp" = { action = "column-move-to-workspace-previous", cooldown_ms = 150 }
"Mod+WheelRight" = "window-focus-right"
"Mod+WheelLeft" = "window-focus-left"
"Mod+Ctrl+WheelRight" = "column-move-right"
"Mod+Ctrl+WheelLeft" = "column-move-left"
"Mod+Shift+WheelDown" = "window-focus-right"
"Mod+Shift+WheelUp" = "window-focus-left"
"Mod+Ctrl+Shift+WheelDown" = "column-move-right"
"Mod+Ctrl+Shift+WheelUp" = "column-move-left"

"Mod+1" = "workspace-switch:1"
"Mod+2" = "workspace-switch:2"
"Mod+3" = "workspace-switch:3"
"Mod+4" = "workspace-switch:4"
"Mod+5" = "workspace-switch:5"
"Mod+6" = "workspace-switch:6"
"Mod+7" = "workspace-switch:7"
"Mod+8" = "workspace-switch:8"
"Mod+9" = "workspace-switch:9"
"Mod+Shift+1" = "column-move-to-workspace:1"
"Mod+Shift+2" = "column-move-to-workspace:2"
"Mod+Shift+3" = "column-move-to-workspace:3"
"Mod+Shift+4" = "column-move-to-workspace:4"
"Mod+Shift+5" = "column-move-to-workspace:5"
"Mod+Shift+6" = "column-move-to-workspace:6"
"Mod+Shift+7" = "column-move-to-workspace:7"
"Mod+Shift+8" = "column-move-to-workspace:8"
"Mod+Shift+9" = "column-move-to-workspace:9"

# Columns
"Mod+BracketLeft" = "window-consume-or-expel-left"
"Mod+BracketRight" = "window-consume-or-expel-right"
"Mod+Comma" = "window-consume-left"
"Mod+Period" = "window-consume-right"

"Mod+R" = "window-cycle-primary-extent"
"Mod+Shift+R" = "window-cycle-secondary-extent"
"Mod+F" = { action = "window-toggle-maximize", repeat = false }
"Mod+Shift+F" = { action = "window-toggle-fullscreen", repeat = false }
"Mod+Ctrl+F" = "window-set-primary-extent:1.0"
"Mod+C" = "column-center"
"Mod+Ctrl+C" = "column-center"

"Mod+Minus" = "window-modify-primary-extent:-0.1"
"Mod+Equal" = "window-modify-primary-extent:0.1"
"Mod+Shift+Minus" = "window-modify-secondary-extent:-0.1"
"Mod+Shift+Equal" = "window-modify-secondary-extent:0.1"

"Mod+V" = { action = "window-toggle-floating", repeat = false }
"Mod+Shift+V" = { action = "window-focus-switch-floating", repeat = false }
"Mod+W" = { action = "column-toggle-tabbed", repeat = false }

# Screenshots go to ~/Pictures/Screenshots and the clipboard.
#   Mod+S                    region (drag with slurp, Esc cancels)
#   Mod+Shift+S, Print       the whole focused monitor
"Mod+S" = { action = "spawn:f=~/Pictures/Screenshots/\"Screenshot from $(date '+%Y-%m-%d %H-%M-%S').png\"; g=$(slurp) && grim -g \"$g\" \"$f\" && wl-copy < \"$f\"", repeat = false }
"Mod+Shift+S" = { action = "spawn:f=~/Pictures/Screenshots/\"Screenshot from $(date '+%Y-%m-%d %H-%M-%S').png\"; o=$(umbriel workspaces --json | jq -r '(.ok? // .)[] | select(.focused) | .output'); grim -o \"$o\" \"$f\" && wl-copy < \"$f\"", repeat = false }
"Print" = { action = "spawn:f=~/Pictures/Screenshots/\"Screenshot from $(date '+%Y-%m-%d %H-%M-%S').png\"; o=$(umbriel workspaces --json | jq -r '(.ok? // .)[] | select(.focused) | .output'); grim -o \"$o\" \"$f\" && wl-copy < \"$f\"", repeat = false }

"Mod+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }
"Mod+Shift+E" = "session-quit"
"Ctrl+Alt+Delete" = "session-quit"
"Mod+Shift+P" = "dpms-off"
"Mod+Shift+O" = "output-toggle:eDP-1"
