# zellij takes only Alt keys; Alt m opens the menu for the rest, Esc leaves it.

[[key]]
keys = "Alt p"
desc = "project picker: sessions, project dirs, zoxide; type a new name to create"
star = true

[[key]]
keys = "Alt g"
desc = "lazygit in a floating pane"
star = true

[[key]]
keys = "Alt n"
desc = "new pane"
star = true

[[key]]
keys = "Alt x"
desc = "close pane"
star = true

[[key]]
keys = "Alt Left"
desc = "focus pane left (at the edge: previous tab)"
star = true

[[key]]
keys = "Alt Right"
desc = "focus pane right (at the edge: next tab)"

[[key]]
keys = "Alt Up"
desc = "focus pane up"

[[key]]
keys = "Alt Down"
desc = "focus pane down"

[[key]]
keys = "Alt t"
desc = "new tab"
star = true

[[key]]
keys = "Alt 1"
desc = "go to tab 1 (2…9 likewise)"

[[key]]
keys = "Alt z"
desc = "zoom pane"

[[key]]
keys = "Alt f"
desc = "show / hide floating panes"

[[key]]
keys = "Alt m"
desc = "menu: one more letter for everything below"
star = true

[[key]]
keys = "Alt m r"
desc = "split pane right"

[[key]]
keys = "Alt m d"
desc = "split pane down"

[[key]]
keys = "Alt m a"
desc = "add a stacked pane"

[[key]]
keys = "Alt m f"
desc = "float pane ↔ embed it"

[[key]]
keys = "Alt m i"
desc = "pin a floating pane on top"

[[key]]
keys = "Alt m n"
desc = "rename pane"

[[key]]
keys = "Alt m t"
desc = "rename tab"

[[key]]
keys = "Alt m x"
desc = "close tab"

[[key]]
keys = "Alt m b"
desc = "move pane to its own tab"

[[key]]
keys = "Alt m y"
desc = "type into all panes of the tab (toggle)"

[[key]]
keys = "Alt m /"
desc = "search the scrollback"

[[key]]
keys = "Alt m e"
desc = "open scrollback in nvim"

[[key]]
keys = "Alt m c"
desc = "copy last command's output"

[[key]]
keys = "Alt m s"
desc = "session manager: switch, resurrect, delete"

[[key]]
keys = "Alt m q"
desc = "detach from the session"

[[key]]
keys = "Alt m R"
desc = "resize mode: hjkl grow, HJKL shrink, Esc leaves"

[[key]]
keys = "Alt m M"
desc = "move mode: hjkl or n moves the pane, Esc leaves"

[[key]]
keys = "Alt m S"
desc = "scroll mode: jk, d/u, g/G, / search, Esc leaves"

[[key]]
keys = "zellij action rename-session NAME"
desc = "rename session; dropping the s- prefix keeps it after the window closes"
